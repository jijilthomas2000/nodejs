version: '3.8'

services:

  frontend:
    build: ./frontend

    container_name: reactapp

    ports:
      - "80:3000"

    depends_on:
      - backend

  backend:
    build: ./backend

    container_name: nodeapp

    ports:
      - "5000:5000"

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    container_name: postgresdb

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infocaredb

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
